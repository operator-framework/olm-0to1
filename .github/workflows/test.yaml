name: test

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: migration CLI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

  e2e-smoke:
    name: migration CLI E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_CLUSTER_NAME: olm-0to1-smoke
      E2E_FIXTURE_CLUSTER_NAME: olm-0to1-smoke
      E2E_FIXTURE_KUBECONFIG: ${{ github.workspace }}/library-olm/.kubeconfig/olm-0to1-smoke
      E2E_KUBECONFIG: ${{ github.workspace }}/library-olm/.kubeconfig/olm-0to1-smoke
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The fixture setup and snapshots are pinned to the library-olm module
      # revision used by the standalone CLIs. The test builds this repo's binaries.
      - uses: actions/checkout@v7
        with:
          repository: operator-framework/library-olm
          ref: 4c37ce218c2eecf9eb5231e038340ce63012ab99
          path: library-olm
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up controller-free fixture cluster
        run: make -C library-olm migration/e2e-fixture-setup
      - name: Replay one OLMv0 operator fixture
        run: make -C library-olm migration/e2e-install-fixture-v0 E2E_OPERATOR=ecr-secret-operator
      - name: Exercise both standalone CLIs
        run: make e2e-smoke
      - name: Capture cluster diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          kubectl --kubeconfig "$E2E_KUBECONFIG" get subscriptions,clusterserviceversions,catalogsources -A -o wide > artifacts/olmv0.txt 2>&1 || true
          kubectl --kubeconfig "$E2E_KUBECONFIG" get clustercatalogs,clusterextensions,clusterobjectsets -o wide > artifacts/olmv1.txt 2>&1 || true
      - name: Tear down fixture cluster
        if: always()
        run: make -C library-olm migration/e2e-teardown
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migration-cli-e2e-smoke-diagnostics
          path: artifacts/
          if-no-files-found: ignore
